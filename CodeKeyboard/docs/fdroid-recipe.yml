AutoName: CodeKeyboard
Summary: Sofle-inspired split mechanical keyboard layout for Android
Description: |-
  CodeKeyboard is a programmer-focused Android keyboard inspired by the Sofle
  split mechanical keyboard layout.

  Features include home-row modifiers, multiple layers (Base, Lower, Raise,
  Adjust, Func), an emoji panel with category tabs and skin tone variants, word
  suggestions with fuzzy matching, and a dark theme. Fully offline with no
  telemetry or ads.

RepoType: git
Repo: https://github.com/ikouchiha47/codekeyboard

